<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Say Hello</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="hello-card">
        <p class="eyebrow">A tiny JavaScript greeting</p>
        <h1>Say hello</h1>
        <p class="intro">Type your name and let the page greet you.</p>

        <form id="greeting-form">
            <label for="name">Your name</label>
            <div class="input-row">
                <input type="text" id="name" name="name" placeholder="Enter your name" autocomplete="name" required>
                <button type="submit">Say hello</button>
            </div>
        </form>

        <p id="greeting" class="greeting" aria-live="polite"></p>
    </main>
</body>
</html>
